# RULE 4 — Suspicious DNS Query Post-Email Activity
title: Suspicious DNS Query from Email or Office Process
id: 8f1b4e7c-6a2d-4c5f-a9e3-2b7d0f4a8c1e
status: experimental
description: |
  Detects Office or email client processes issuing DNS queries to suspicious domains:
  free TLDs associated with phishing infrastructure (.tk, .ml, .ga, .cf, .gq),
  URL shorteners that mask malicious destinations, or paste/file-share sites used
  for payload staging. When an email client resolves such a domain, it strongly
  suggests the user has clicked a link in a phishing email.
author: ThreatFlow Detection Engineering
date: 2026-11-13
modified: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1566/002/
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1102/
logsource:
  category: dns_query
  product: windows
detection:
  selection_process:
    Image|endswith:
      - '\OUTLOOK.EXE'
      - '\THUNDERBIRD.EXE'
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_domains:
    QueryName|endswith:
      - '.tk'
      - '.ml'
      - '.ga'
      - '.cf'
      - '.gq'
  selection_shorteners:
    QueryName|contains:
      - 'bit.ly'
      - 'tinyurl.com'
      - 'rb.gy'
      - 'cutt.ly'
      - 'is.gd'
      - 'ow.ly'
      - 'short.io'
  selection_staging:
    QueryName|contains:
      - 'pastebin.com'
      - 'hastebin.com'
      - 'paste.ee'
      - 'raw.githubusercontent.com'
      - 'transfer.sh'
      - 'filebin.net'
      - 'gofile.io'
      - 'temp.sh'
  condition: selection_process and (selection_domains or selection_shorteners or selection_staging)
falsepositives:
  - Legitimate use of URL shorteners in business email newsletters
  - GitHub Actions or automation that queries raw.githubusercontent.com
  - Adjust by adding known-good domains to exclusion list per environment
level: medium
tags:
  - attack.initial_access
  - attack.t1566.002
  - attack.command_and_control
  - attack.t1071.004
  - attack.t1102

