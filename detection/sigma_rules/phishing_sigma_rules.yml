# RULE 5 — ISO Mount and Execute Pattern
title: ISO/IMG Disk Image Mount and Execution (Mark-of-the-Web Bypass)
id: 3d6a2f9e-5b1c-4e8a-b7f4-9c3e1d5a0b2f
status: stable
description: |
  Detects the ISO/IMG phishing delivery technique where adversaries deliver malicious
  disk images via email (bypassing Mark-of-the-Web protections on Windows 10 pre-11H2).
  When the user double-clicks the ISO, it auto-mounts as a drive letter. Executables
  within the ISO lack a Zone.Identifier ADS and therefore execute without SmartScreen
  warnings. This rule detects script engines or shells launching from a removable/optical
  drive letter with Explorer or DllHost as the parent — the hallmark of ISO execution.
author: ThreatFlow Detection Engineering
date: 2026-11-13
modified: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1553/005/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://www.microsoft.com/security/blog/2022/06/16/using-process-creation-properties-to-catch-evasion-techniques/
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\dllhost.exe'
  selection_image:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  selection_drive:
    # Processes running from non-C drive letters (mounted ISO appears as D:\, E:\, etc.)
    CurrentDirectory|re: '^[D-Z]:\\'
  filter_legit_drives:
    # Exclude known legitimate secondary drives in your environment
    CurrentDirectory|startswith:
      - 'D:\Program Files'
      - 'D:\ProgramData'
  condition: selection_parent and selection_image and selection_drive and not filter_legit_drives
falsepositives:
  - Developers running scripts from USB drives or secondary local drives
  - IT processes launched from network-mapped drives
  - Legitimate software on D:\ or other fixed secondary disks
  - Tune CurrentDirectory filter to match your storage layout
level: high
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
  - attack.defense_evasion
  - attack.t1553.005
