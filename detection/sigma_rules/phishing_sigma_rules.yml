# RULE 2 — Email Attachment Execution via Script Host
title: Email Attachment Execution via Windows Script Host
id: 2c8e4f1a-7d5b-4c9e-8a3f-6b2d0e4c8f1a
status: stable
description: |
  Detects Windows Script Host (wscript.exe / cscript.exe) or MSHTA executing scripts
  with extensions commonly delivered as phishing email attachments (.js, .jse, .vbs,
  .vbe, .wsf, .hta). This pattern indicates a user opened a malicious attachment which
  then launched a scripting engine — a primary initial access vector in phishing campaigns.
author: ThreatFlow Detection Engineering
date: 2026-11-13
modified: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1059/007/
  - https://attack.mitre.org/techniques/T1218/005/
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_extension:
    CommandLine|contains:
      - '.js '
      - '.jse '
      - '.vbs '
      - '.vbe '
      - '.wsf '
      - '.hta '
      - '.js"'
      - '.jse"'
      - '.vbs"'
      - '.hta"'
  selection_userpath:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\Desktop\'
  condition: selection_image and (selection_extension or selection_userpath)
falsepositives:
  - Legitimate enterprise logon scripts using VBScript
  - Software deployment automation using WSH
  - Internal IT tooling — verify by checking script content and origin path
level: medium
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1059.005
  - attack.t1059.007
  - attack.t1218.005

