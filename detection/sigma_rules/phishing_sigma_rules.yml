# RULE 1 — Suspicious Office Child Process
title: Suspicious Office Application Child Process
id: 7b9d1f6c-3a4e-4b8f-9c2d-1e5f7a0b6d3e
status: stable
description: |
  Detects Microsoft Office applications (Word, Excel, PowerPoint, Outlook) spawning
  suspicious child processes commonly associated with macro-based phishing attacks.
  Adversaries abuse Office VBA macros to execute scripting engines, command shells,
  or Living-off-the-Land binaries (LOLBas) as the first stage of a phishing payload
  delivery chain.
author: ThreatFlow Detection Engineering
date: 2026-11-13
modified: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://lolbas-project.github.io/
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\ONENOTE.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\regsvr32.exe'
      - '\rundll32.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\msiexec.exe'
      - '\InstallUtil.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate IT administration scripts triggered from scheduled Outlook macros
  - Software installers launched from Office add-ins (rare but possible)
  - Automated reporting macros in managed enterprise environments
level: high
tags:
  - attack.initial_access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
  - attack.t1059
  - attack.defense_evasion
  - attack.t1218

