# RULE 3 — Credential Access via LSASS Memory
title: Credential Access via LSASS Memory Access
id: 5a3f8b2c-1e4d-4a7f-9c6b-8d2f0e3a5b1c
status: stable
description: |
  Detects suspicious processes opening a handle to LSASS (Local Security Authority
  Subsystem Service) with memory-read access rights. This is the primary technique
  used by credential dumping tools such as Mimikatz, ProcDump, Cobalt Strike Beacon,
  and comsvcs.dll MiniDump to extract plaintext credentials, NTLM hashes, and
  Kerberos tickets from memory — a common post-exploitation step following phishing.
author: ThreatFlow Detection Engineering
date: 2026-11-13
modified: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/gentilkiwi/mimikatz
  - https://docs.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-openprocess
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x147a'
      - '0x1fffff'
      - '0x143a'
  filter_legit:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\csrss.exe'
      - '\wininit.exe'
      - '\services.exe'
      - '\lsm.exe'
      - '\svchost.exe'
      - '\WerFault.exe'
      - '\taskmgr.exe'
  condition: selection_target and selection_access and not filter_legit
falsepositives:
  - Endpoint Detection and Response (EDR) agents reading LSASS for telemetry
  - System monitoring tools with PROCESS_QUERY_INFORMATION rights
  - Antivirus software performing memory scanning
  - Add your EDR/AV process paths to the filter_legit block
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.t1078

